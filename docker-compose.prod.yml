# Production (VPS). Used by the deploy job:
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Only the API runs here. MongoDB and MinIO are NOT services in this file: the
# API uses the MongoDB and MinIO that already run on the VPS, set by
# MONGODB_URI and MINIO_* in the server's .env file.
# (docker-compose.yml is only for local development.)

services:
  api:
    build: .
    image: depot-entry-api:latest
    container_name: depot-entry-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    # Host networking: the API reaches MongoDB and MinIO on the VPS at 127.0.0.1
    # exactly like a normal Node process, and listens on PORT from .env (put Nginx in front)
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
