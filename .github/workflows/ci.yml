name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded test runs on the same branch/PR (deploys are never cancelled, see below)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    # Throwaway MongoDB for the tests only. The tests wipe their database, so they
    # must never run against the real MongoDB on the VPS.
    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Throwaway credentials for the CI containers only (not real secrets)
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://ci:ci-password@127.0.0.1:27017/client_management?authSource=admin
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      SWAGGER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: find src tests -name '*.js' -print0 | xargs -0 -n1 node --check

      # The MinIO image needs startup arguments, which `services:` cannot pass
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1

      - name: Verify the app starts and reports healthy
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health; then echo; kill %1; exit 0; fi
            sleep 1
          done
          echo "Server did not become healthy"; cat server.log; exit 1

      - name: Run tests
        run: npm test

      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio || true

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Validate production compose file
        run: |
          # compose reads env_file: .env, which only exists on the VPS
          touch .env
          docker compose -f docker-compose.prod.yml config --quiet

      - name: Build image
        run: docker build -t depot-entry-api:ci .

      - name: Image starts Node and contains no secrets
        run: |
          docker run --rm depot-entry-api:ci node -e "console.log('node', process.version)"
          if docker run --rm depot-entry-api:ci sh -c 'ls -a /app' | grep -E '^\.env$'; then
            echo ".env must not be inside the image"; exit 1
          fi

  deploy:
    name: Deploy to VPS
    needs: [test, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time; a newer push waits instead of killing a deploy halfway
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Fails with a clear list of missing secrets (values are never printed)
      - name: Check deploy secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_PASSPHRASE: ${{ secrets.VPS_SSH_PASSPHRASE }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          missing=""
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_SSH_PASSPHRASE VPS_HOST_KEY; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty GitHub Actions secrets:$missing"
            echo "Add them in ${{ github.repository }}: Settings > Secrets and variables > Actions > Repository secrets (Secrets tab, not Variables)."
            exit 1
          fi
          echo "All deploy secrets are set."

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The private key is passphrase protected
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          fingerprint: ${{ secrets.VPS_HOST_KEY }}
          port: 2244

          script: |
            set -e

            echo "==> Go to application directory"
            cd /opt/apps/client-management

            if [ ! -f .env ]; then
              echo "Missing /opt/apps/client-management/.env"
              exit 1
            fi

            echo "==> Pull latest code"
            git fetch origin main
            git reset --hard origin/main

            echo "==> Build and start API"
            docker compose -f docker-compose.prod.yml up -d --build api

            echo "==> Wait for the API to report healthy"
            for i in $(seq 1 30); do
              status=$(docker inspect --format '{{.State.Health.Status}}' depot-entry-api 2>/dev/null || echo missing)

              if [ "$status" = "healthy" ]; then
                echo "API is healthy"
                break
              fi

              if [ "$i" = "30" ]; then
                echo "API did not become healthy (last status: $status)"
                docker compose -f docker-compose.prod.yml logs --tail=100 api
                exit 1
              fi

              sleep 5
            done

            echo "==> Remove unused images"
            docker image prune -f

            echo "==> Deployment status"
            docker compose -f docker-compose.prod.yml ps

            echo "==> Deployment completed successfully"
