name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    services:
      mongodb:
        image: mongo:8
        env:
          MONGO_INITDB_ROOT_USERNAME: ci
          MONGO_INITDB_ROOT_PASSWORD: ci-password
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    # Throwaway credentials for the CI containers only (not real secrets)
    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://ci:ci-password@127.0.0.1:27017/client_management?authSource=admin
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      MINIO_ENDPOINT: 127.0.0.1
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ci-minio
      MINIO_SECRET_KEY: ci-minio-secret
      SWAGGER_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check syntax
        run: find src tests -name '*.js' -print0 | xargs -0 -n1 node --check

      # The MinIO image needs startup arguments, which `services:` cannot pass
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER="$MINIO_ACCESS_KEY" \
            -e MINIO_ROOT_PASSWORD="$MINIO_SECRET_KEY" \
            cgr.dev/chainguard/minio:latest server /data
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 2
          done
          echo "MinIO did not become ready"; docker logs minio; exit 1

      - name: Verify the app starts and reports healthy
        run: |
          node src/server.js > server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:5000/api/health; then echo; kill %1; exit 0; fi
            sleep 1
          done
          echo "Server did not become healthy"; cat server.log; exit 1

      - name: Run tests
        run: npm test

      - name: MinIO logs on failure
        if: failure()
        run: docker logs minio || true
